<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Endure">
<meta name="theme-color" content="#1C1C18">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Endure</title>
<style>
  :root {
    --bg:    #1C1C18;
    --bg2:   #242420;
    --bg3:   #2C2C26;
    --bg4:   #343430;
    --border:#3A3A30;
    --border2:#4A4A3C;
    --text:  #E8E0CC;
    --text2: #A09880;
    --text3: #6A6450;
    --olive: #7A8C4A;
    --olive-dim: #2A2E1A;
    --sage:  #A8B87A;
    --sand:  #D4C8A8;
    --warn:  #C4783C;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; }
  #app { height: 100%; display: flex; flex-direction: column; }

  /* ── SCREENS ── */
  .screen { flex: 1; overflow-y: auto; padding: calc(var(--safe-top) + 20px) 16px 16px; display: none; }
  .screen.active { display: block; }

  /* ── NAV ── */
  .nav { display: flex; justify-content: space-around; background: var(--bg2); border-top: 1px solid var(--border); padding: 8px 0 calc(8px + var(--safe-bot)); flex-shrink: 0; }
  .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; color: var(--text3); font-size: 10px; padding: 4px 18px; cursor: pointer; letter-spacing: .03em; }
  .nav-btn.active { color: var(--sage); }
  .nav-icon { font-size: 19px; }

  /* ── WORKOUT HEADER ── */
  .wk-day-header { margin-bottom: 20px; }
  .wk-eyebrow { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 5px; }
  .wk-today-title { font-size: 24px; font-weight: 700; color: var(--text); margin-bottom: 8px; line-height: 1.2; }
  .wk-chips { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; }
  .chip { font-size: 11px; font-weight: 600; padding: 4px 11px; border-radius: 20px; letter-spacing: .04em; text-transform: uppercase; }
  .chip-strength { background: #2E2C1A; color: #C0B060; border: 1px solid #4A441A; }
  .chip-climb   { background: var(--olive-dim); color: var(--sage); border: 1px solid #3A4020; }
  .chip-cycle   { background: #1A2228; color: #70A8C0; border: 1px solid #243040; }
  .chip-dur     { background: var(--bg3); color: var(--text3); border: 1px solid var(--border); }

  .start-btn { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 14px 18px; background: var(--olive-dim); border: 1px solid var(--olive); border-radius: 12px; color: var(--sage); font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 20px; letter-spacing: .02em; }
  .start-btn:active { opacity: .8; }
  .go-arrow { font-size: 18px; }

  .section-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 10px; }
  .preview-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 13px; background: var(--bg2); border-radius: 9px; margin-bottom: 5px; border: 1px solid var(--border); }
  .preview-name { font-size: 13px; color: var(--text); }
  .preview-target { font-size: 11px; color: var(--text3); font-family: monospace; text-align: right; flex-shrink: 0; max-width: 55%; }

  /* ── ACTIVE WORKOUT ── */
  .wk-header { margin-bottom: 16px; }
  .wk-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .progress-wrap { height: 2px; background: var(--border); border-radius: 2px; }
  .progress-fill { height: 100%; background: var(--olive); border-radius: 2px; transition: width .35s ease; }
  .progress-label { font-size: 11px; color: var(--text3); margin-top: 5px; letter-spacing: .03em; }

  .ex-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 8px; overflow: hidden; transition: border-color .25s; }
  .ex-card.done { border-color: var(--olive); }
  .ex-header { display: flex; align-items: center; gap: 12px; padding: 13px 14px; cursor: pointer; user-select: none; }
  .ex-circle { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border2); background: transparent; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 13px; color: transparent; transition: all .2s; cursor: pointer; }
  .ex-card.done .ex-circle { background: var(--olive); border-color: var(--olive); color: var(--bg); }
  .ex-info { flex: 1; min-width: 0; }
  .ex-name { font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.3; }
  .ex-card.done .ex-name { color: var(--text3); text-decoration: line-through; text-decoration-color: var(--text3); }
  .ex-tgt { font-size: 11px; color: var(--text3); font-family: monospace; margin-top: 2px; }
  .ex-chevron { font-size: 14px; color: var(--text3); transition: transform .2s; flex-shrink: 0; }
  .ex-card.open .ex-chevron { transform: rotate(180deg); }
  .ex-body { padding: 0 14px 14px; display: none; }
  .ex-card.open .ex-body { display: block; }

  /* ── SET ROWS ── */
  .sets-head { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
  .set-row { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
  .set-num { font-size: 11px; color: var(--text3); font-family: monospace; width: 30px; flex-shrink: 0; }
  .set-field { flex: 1; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 14px; font-family: monospace; color: var(--text); outline: none; min-width: 0; }
  .set-field:focus { border-color: var(--olive); }
  .set-field.logged { border-color: var(--olive-dim); background: var(--olive-dim); color: var(--sage); }
  .set-x { font-size: 13px; color: var(--text3); flex-shrink: 0; }
  .set-check { width: 34px; height: 34px; border-radius: 8px; background: var(--bg3); border: 1px solid var(--border); color: var(--text3); font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .2s; }
  .set-check.logged { background: var(--olive-dim); border-color: var(--olive); color: var(--sage); }
  .set-check:active { opacity: .7; }
  .add-set { width: 100%; padding: 7px; background: none; border: 1px dashed var(--border2); border-radius: 8px; color: var(--text3); font-size: 12px; cursor: pointer; margin-top: 2px; }
  .add-set:active { background: var(--bg3); }
  .note-field { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; font-size: 13px; color: var(--text); font-family: -apple-system, sans-serif; outline: none; resize: none; min-height: 68px; line-height: 1.4; }
  .select-field { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 14px; color: var(--text); font-family: -apple-system, sans-serif; outline: none; }
  .select-field:focus { border-color: var(--olive); }
  .note-field:focus { border-color: var(--olive); }

  /* ── FINISH ── */
  .finish-btn { width: 100%; padding: 15px; background: var(--olive); color: var(--bg); font-size: 15px; font-weight: 700; border: none; border-radius: 12px; cursor: pointer; margin-top: 16px; letter-spacing: .02em; }
  .finish-btn:disabled { background: var(--bg3); color: var(--text3); }
  .finish-btn:active { opacity: .85; }

  /* ── SUMMARY ── */
  .sum-title { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
  .sum-sub { font-size: 13px; color: var(--text2); margin-bottom: 20px; }
  .sum-ex { background: var(--bg2); border: 1px solid var(--border); border-radius: 11px; padding: 11px 13px; margin-bottom: 7px; }
  .sum-ex-name { font-size: 13px; font-weight: 500; margin-bottom: 3px; }
  .sum-ex-detail { font-size: 12px; color: var(--text2); font-family: monospace; line-height: 1.5; }
  .sum-notes-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .1em; margin: 16px 0 8px; }
  .sum-notes { width: 100%; background: var(--bg2); border: 1px solid var(--border); border-radius: 11px; padding: 12px 13px; font-size: 13px; color: var(--text); font-family: -apple-system, sans-serif; outline: none; resize: none; min-height: 80px; }
  .sum-notes:focus { border-color: var(--olive); }
  .save-btn { width: 100%; padding: 15px; background: var(--olive); color: var(--bg); font-size: 15px; font-weight: 700; border: none; border-radius: 12px; cursor: pointer; margin-top: 14px; }
  .save-btn:disabled { background: var(--bg3); color: var(--text3); }
  .save-btn:active { opacity: .85; }
  .save-msg { text-align: center; font-size: 13px; padding: 10px 14px; margin-top: 8px; border-radius: 9px; }
  .save-msg.ok  { background: var(--olive-dim); color: var(--sage); }
  .save-msg.err { background: #2E1A0A; color: var(--warn); }

  /* ── CALENDAR ── */
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .cal-month-title { font-size: 20px; font-weight: 700; color: var(--text); }
  .cal-nav-btn { width: 36px; height: 36px; border-radius: 9px; background: var(--bg2); border: 1px solid var(--border); color: var(--text2); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .cal-nav-btn:active { opacity: .7; }
  .cal-dow-row { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 6px; }
  .cal-dow { text-align: center; font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; padding: 4px 0; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 24px; }
  .cal-day { aspect-ratio: 1; border-radius: 9px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; position: relative; background: var(--bg2); border: 1px solid transparent; }
  .cal-day.empty { background: transparent; cursor: default; border-color: transparent; }
  .cal-day.today { border-color: var(--olive); }
  .cal-day.today .cal-day-num { color: var(--sage); font-weight: 700; }
  .cal-day.has-session .cal-dot { display: block; }
  .cal-day.logged { background: var(--olive-dim); border-color: #3A4A1A; }
  .cal-day.logged .cal-day-num { color: var(--sage); }
  .cal-day.scheduled { border-color: var(--border2); }
  .cal-day.past-no-session { opacity: .4; }
  .cal-day-num { font-size: 13px; color: var(--text2); line-height: 1; }
  .cal-dot { display: none; width: 5px; height: 5px; border-radius: 50%; background: var(--olive); }
  .cal-day.logged .cal-dot { background: var(--sage); }

  /* ── CALENDAR DETAIL ── */
  .cal-detail { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-top: 4px; }
  .cal-detail-date { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
  .cal-detail-name { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 12px; }
  .cal-detail-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--border); }
  .cal-detail-ex { font-size: 13px; color: var(--text); }
  .cal-detail-val { font-size: 12px; color: var(--text2); font-family: monospace; text-align: right; }
  .cal-expand-btn { width: 100%; padding: 8px; background: none; border: 1px dashed var(--border2); border-radius: 8px; color: var(--text3); font-size: 12px; cursor: pointer; margin-top: 10px; }
  .cal-expand-btn:active { background: var(--bg3); }
  .cal-sets-detail { font-size: 11px; color: var(--text3); font-family: monospace; line-height: 1.7; margin-top: 3px; }
  .cal-future-ex { font-size: 12px; color: var(--text3); padding: 5px 0; border-top: 1px solid var(--border); display: flex; justify-content: space-between; gap: 12px; }
  .cal-future-tgt { font-family: monospace; }
  .cal-open-btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 10px; background: var(--olive-dim); border: 1px solid var(--olive); border-radius: 9px; color: var(--sage); font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 12px; letter-spacing: .02em; }
  .cal-open-btn:active { opacity: .8; }

  /* ── HISTORY ── */
  .hist-empty { text-align: center; padding: 60px 20px; color: var(--text3); font-size: 14px; line-height: 1.6; }
  .hist-item { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 8px; }
  .hist-date { font-size: 11px; color: var(--text3); margin-bottom: 3px; letter-spacing: .03em; }
  .hist-name { font-size: 15px; font-weight: 500; }
  .hist-count { font-size: 12px; color: var(--text2); margin-top: 4px; }

  /* ── SETTINGS ── */
  .set-section { margin-bottom: 24px; }
  .set-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 10px; }
  .settings-row { display: flex; align-items: center; justify-content: space-between; padding: 13px 14px; background: var(--bg2); border: 1px solid var(--border); border-radius: 11px; margin-bottom: 6px; }
  .settings-row-title { font-size: 14px; color: var(--text); }
  .settings-row-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .toggle { width: 44px; height: 26px; background: var(--border); border-radius: 13px; cursor: pointer; position: relative; transition: background .2s; border: none; flex-shrink: 0; }
  .toggle.on { background: var(--olive); }
  .toggle::after { content: ''; width: 20px; height: 20px; background: var(--sand); border-radius: 50%; position: absolute; top: 3px; left: 3px; transition: transform .2s; }
  .toggle.on::after { transform: translateX(18px); }
  .sheet-input { width: 100%; background: var(--bg2); border: 1px solid var(--border); border-radius: 11px; padding: 12px 14px; font-size: 12px; font-family: monospace; color: var(--text2); outline: none; }
  .sheet-input:focus { border-color: var(--olive); color: var(--text); }
  .connect-btn { width: 100%; padding: 13px 14px; background: var(--bg2); border: 1px solid var(--border); border-radius: 11px; color: var(--text2); font-size: 14px; cursor: pointer; text-align: left; margin-top: 6px; }
  .connect-btn.on { border-color: var(--olive); color: var(--sage); }

  /* ── BLOCK SESSIONS ── */
  .wk-block-line { font-size: 12px; color: var(--text2); }
  .wk-empty { color: var(--text3); font-size: 14px; padding: 20px 0; }
  .session-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .session-card.logged { border-color: var(--olive); }
  .session-card .preview-row { background: var(--bg3); }
  .session-card .start-btn { margin: 10px 0 0; padding: 11px 14px; }
  .session-name { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
  .session-card .wk-chips, .cal-detail .wk-chips { flex-wrap: wrap; margin-bottom: 10px; }
  .chip { white-space: nowrap; }
  .ex-how { font-size: 12px; line-height: 1.45; color: var(--text2); margin-bottom: 10px; }
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .field-wrap { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--text3); min-width: 0; }
  .log-field { width: 100%; min-width: 0; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; font-size: 16px; color: var(--text); outline: none; }
  .log-field:focus { border-color: var(--olive); }
  .row-card { padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px solid var(--border); }
  .add-row { width: 100%; padding: 8px; background: none; border: 1px dashed var(--border2); border-radius: 8px; color: var(--text3); font-size: 12px; cursor: pointer; }
  .discard-btn { width: 100%; padding: 12px; background: none; color: var(--text3); font-size: 13px; border: none; cursor: pointer; }
  .library summary { padding: 13px 14px; background: var(--bg2); border: 1px solid var(--border); border-radius: 11px; font-size: 14px; color: var(--text); cursor: pointer; margin-bottom: 6px; }
  .cal-detail { margin-bottom: 8px; }
  .decision-card { background: #2A2014; border: 1px solid var(--warn); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .decision-title { font-size: 11px; color: var(--warn); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 8px; }
  .decision-item, .pull-item { padding: 10px 0; border-top: 1px solid var(--border); }
  .decision-title + .decision-item { border-top: none; padding-top: 0; }
  .decision-name { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--text); margin-bottom: 8px; }
  .decision-name span { font-size: 12px; color: var(--text3); flex-shrink: 0; }
  .decision-actions, .chip-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; }
  .choice-details { display: contents; }
  .choice-details > .move-row, .choice-details > .chip-row, .choice-details > .warning { flex-basis: 100%; }
  .choice-btn { min-height: 38px; padding: 8px 13px; background: var(--bg3); border: 1px solid var(--border2); border-radius: 9px; color: var(--text); font-size: 13px; cursor: pointer; list-style: none; }
  summary.choice-btn::-webkit-details-marker { display: none; }
  .choice-details[open] > summary.choice-btn { border-color: var(--olive); color: var(--sage); }
  .plan-options { margin-top: 8px; }
  .plan-options > summary { padding: 8px 2px; color: var(--text3); font-size: 13px; cursor: pointer; }
  .pull-list { margin-top: 12px; }
  .option-label { font-size: 11px; color: var(--text3); margin: 10px 0 5px; }
  .option-label + .chip-row, .option-label + .move-row { margin-top: 0; }
  .warning { font-size: 12px; line-height: 1.4; color: var(--warn); margin: 6px 0; }
  .skip-line { font-size: 12px; color: var(--text3); margin-bottom: 8px; }
  .session-card.skipped { opacity: .75; }
  .session-card.skipped .session-name { text-decoration: line-through; color: var(--text3); }
  .cal-day.needs { border-color: var(--warn); }
  .cal-day.needs .cal-dot { background: var(--warn); }
  .cal-day.skipped .cal-day-num { text-decoration: line-through; color: var(--text3); }
  .cal-day.skipped .cal-dot { background: var(--text3); }
  .move-row { display: flex; gap: 8px; margin-top: 8px; }
  .move-btn { padding: 0 16px; background: var(--bg3); border: 1px solid var(--border2); border-radius: 8px; color: var(--text2); font-size: 13px; cursor: pointer; }
  .sum-date { margin-bottom: 16px; }
  .log-field[type="date"] { -webkit-appearance: none; appearance: none; min-height: 42px; }

  /* iOS Safari zooms into any field with text under 16px. */
  input, textarea, select { font-size: 16px !important; }
  .cal-detail-date { margin-top: 4px; }

  /* ── TOAST ── */
  .toast { position: fixed; bottom: calc(72px + var(--safe-bot)); left: 50%; transform: translateX(-50%) translateY(10px); background: var(--bg3); color: var(--text); border: 1px solid var(--border2); border-radius: 10px; padding: 9px 18px; font-size: 13px; opacity: 0; pointer-events: none; transition: all .25s; white-space: nowrap; z-index: 999; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  select { background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 8px; font-size: 13px; outline: none; }
</style>
</head>
<body>
<div id="app">

  <!-- WORKOUT (landing screen) -->
  <div class="screen active" id="screen-workout">
    <!-- idle state: shown when no active session -->
    <div id="wk-idle">
      <div class="wk-day-header">
        <div class="wk-eyebrow" id="wk-eyebrow"></div>
        <div class="wk-today-title" id="wk-today-title"></div>
        <div class="wk-block-line" id="wk-block-line"></div>
      </div>
      <div id="wk-sessions"></div>
    </div>
    <!-- active session -->
    <div id="wk-active" style="display:none">
      <div class="wk-header">
        <div class="wk-title" id="wk-title"></div>
        <div class="progress-wrap"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
        <div class="progress-label" id="progress-label"></div>
      </div>
      <div id="ex-list"></div>
      <button class="finish-btn" id="finish-btn">Finish &amp; review</button>
      <button class="discard-btn" id="discard-btn">Discard session</button>
    </div>
  </div>

  <!-- SUMMARY -->
  <div class="screen" id="screen-summary">
    <div class="sum-title">Session done</div>
    <div class="sum-sub" id="sum-sub"></div>
    <label class="field-wrap sum-date"><span>Session date</span><input class="log-field" type="date" id="sum-date"></label>
    <div id="sum-list"></div>
    <div class="sum-notes-label">Session notes</div>
    <textarea class="sum-notes" id="sum-notes" placeholder="How did it feel? PRs, anything to flag…"></textarea>
    <button class="save-btn" id="save-btn">Save to Google Sheet</button>
    <div class="save-msg" id="save-msg" style="display:none"></div>
  </div>

  <!-- CALENDAR -->
  <div class="screen" id="screen-calendar">
    <div class="cal-header">
      <button class="cal-nav-btn" id="cal-prev">‹</button>
      <div class="cal-month-title" id="cal-month-title"></div>

      <div class="cal-dow">Su</div><div class="cal-dow">Mo</div><div class="cal-dow">Tu</div>
      <div class="cal-dow">We</div><div class="cal-dow">Th</div><div class="cal-dow">Fr</div>

  <!-- SETTINGS -->

      <div class="set-label">Google Sheets</div>
      <div class="settings-row-sub" style="margin-bottom:8px;color:var(--text3);font-size:12px">Paste your Apps Script webhook URL here</div>
      <input class="sheet-input" id="sheet-input" placeholder="https://script.google.com/macros/s/…/exec">
    </div>
    <div class="set-section">
      <div class="set-label">Block</div>
      <div class="settings-row">
        <div><div class="settings-row-title" id="block-name"></div><div class="settings-row-sub" id="week-label"></div><div class="settings-row-sub" id="block-issues"></div></div>
      </div>

        <summary id="library-count"></summary>

  <nav class="nav">
    <button class="nav-btn active" data-screen="workout"><span class="nav-icon">◎</span>Workout</button>
    <button class="nav-btn" data-screen="calendar"><span class="nav-icon">▦</span>Calendar</button>

  </nav>
</div>
<div class="toast" id="toast"></div>

<script src="program.js?v=5"></script>
<script>
const DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS_FULL=["January","February","March","April","May","June","July","August","September","October","November","December"];
const TAG_CHIPS={strength:"chip-strength",climb:"chip-climb",cycle:"chip-cycle",cardio:"chip-cycle",fingers:"chip-climb"};

// ── STATE ──────────────────────────────────────────────────────────────────
let discardArmed=false;
let S = {
  sheetId: "",
  gConnected: false, blockStart: null,
  session: null,
  history: [],  // [{dateKey:"2026-06-29", pid, sid, blockId, name, tag, done, total, exercises:[...]}]
  moves: {},    // planned session id → date it was moved to
  skips: {},    // planned session id → {reason}
};
function load(){
  try{ const r=localStorage.getItem("train3"); if(r) S={...S,...JSON.parse(r)}; }catch(e){}
  const cs=S.session;
  if(cs){
    cs.sourceDate=cs.sourceDate||cs.dateKey;
    if(cs.sid&&!cs.pid) cs.pid=`${cs.dateKey}|${cs.sid}`;
  }
}
function save(){ try{ localStorage.setItem("train3",JSON.stringify(S)); }catch(e){} }

function esc(v){ return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// date helpers
function dateKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function todayKey(){ return dateKey(new Date()); }
function parseKey(key){ const [y,m,d]=key.split("-").map(Number); return new Date(y,m-1,d); }
function daysBetween(a,b){ return Math.round((parseKey(b)-parseKey(a))/864e5); }

// ── BLOCK RESOLUTION ───────────────────────────────────────────────────────
function blockFor(key){ return BLOCKS.find(b=>key>=b.start&&key<=b.end)||null; }
function weekOf(block,key){ return Math.floor(daysBetween(block.start,key)/7)+1; }
function totalWeeks(block){ return Math.ceil((daysBetween(block.start,block.end)+1)/7); }
function resolve(value,week,ctx){ return typeof value==="function"?value(week,ctx):value; }
function completedBefore(block,key,sid,field,value){
  return S.history.filter(h=>h.blockId===block.id&&h.sid===sid&&h.dateKey<key
    &&!block.lightWeeks.includes(weekOf(block,h.dateKey))
    &&(h.exercises||[]).some(e=>e.vals&&e.vals[field]===value)).length;
}
// A planned session keeps one id, built from its original date, wherever it moves.
function pidOf(log){ return log.pid||(log.sid?`${log.dateKey}|${log.sid}`:null); }
function findLog(plan){ return S.history.find(h=>pidOf(h)===plan.pid)||null; }
function planSession(def,block,week,key){
  const ctx={week,key,completed:(sid,field,value)=>completedBefore(block,key,sid,field,value)};
  const exercises=def.items
    .filter(item=>!item.when||item.when(week))
    .map(item=>{
      const lib=LIBRARY[item.id];
      return {id:item.id,n:lib.n,t:lib.t,tags:lib.tags,fields:lib.fields,columns:lib.columns,
        ds:lib.ds,dr:lib.dr,dw:lib.dw,
        tgt:resolve(item.tgt,week,ctx)||"",
        how:[resolve(item.how,week,ctx),lib.how].filter(Boolean).join(" ")};
    });
  return {pid:`${key}|${def.key}`,origKey:key,sid:def.key,blockId:block.id,quickLog:!!def.quickLog,noMakeup:!!def.noMakeup,name:resolve(def.name,week,ctx),tag:def.tag,dur:resolve(def.dur,week,ctx),optional:!!def.optional,exercises};
}
function plannedOn(key){
  const block=blockFor(key); if(!block) return [];
  const week=weekOf(block,key);
  return (block.days[parseKey(key).getDay()]||[]).map(def=>planSession(def,block,week,key));
}
function sessionsFor(key){
  const moves=S.moves||{};
  const own=plannedOn(key).filter(plan=>!moves[plan.pid]);
  const movedIn=Object.keys(moves).filter(pid=>moves[pid]===key)
    .map(pid=>plannedOn(pid.split("|")[0]).find(plan=>plan.pid===pid)).filter(Boolean);
  return [...own,...movedIn];
}
function moveSession(pid,to){
  if(!S.moves) S.moves={};
  if(pid.split("|")[0]===to) delete S.moves[pid]; else S.moves[pid]=to;
}
function addDays(key,days){ const d=parseKey(key); d.setDate(d.getDate()+days); return dateKey(d); }
function weekStart(key){ return addDays(key,-((parseKey(key).getDay()+6)%7)); }
function planStatus(plan,key){
  if(findLog(plan)) return "done";
  if(S.skips?.[plan.pid]) return "skipped";
  return key<todayKey()&&!plan.optional?"needs":"planned";
}
// The decision card covers this calendar week, Monday through yesterday.
function pendingDecisions(){
  const today=todayKey(), items=[];
  for(let key=weekStart(today);key<today;key=addDays(key,1)){
    sessionsFor(key).filter(plan=>planStatus(plan,key)==="needs").forEach(plan=>items.push({plan,key}));
  }
  return items;
}
function upcomingSessions(){
  const today=todayKey(), items=[];
  for(let i=1;i<=7;i++){
    const key=addDays(today,i);
    sessionsFor(key).filter(plan=>planStatus(plan,key)==="planned").forEach(plan=>items.push({plan,key}));
  }
  return items;
}
function recoveryWarnings(plan,to){
  const block=blockFor(to)||blockFor(plan.origKey); if(!block?.recoveryRules) return [];
  const others=key=>sessionsFor(key).filter(p=>p.pid!==plan.pid&&planStatus(p,key)!=="skipped").map(p=>p.sid);
  return block.recoveryRules.filter(rule=>{
    if(rule.first.includes(plan.sid)&&others(addDays(to,rule.gapDays)).some(id=>rule.then.includes(id))) return true;
    return rule.then.includes(plan.sid)&&others(addDays(to,-rule.gapDays)).some(id=>rule.first.includes(id));
  }).map(rule=>rule.message);
}
function shortDate(key){ const d=parseKey(key); return `${DAYS[d.getDay()].slice(0,3)}, ${MONTHS[d.getMonth()]} ${d.getDate()}`; }
function getLogs(key){ return S.history.filter(h=>h.dateKey===key); }

// Every gym session in every week must have a core exercise.
function validateBlock(block){
  const issues=[], weeks=totalWeeks(block);
  for(const defs of Object.values(block.days)){
    for(const def of defs){
      def.items.forEach(item=>{ if(!LIBRARY[item.id]) issues.push(`Unknown exercise: ${item.id}`); });
      if(def.tag!=="strength") continue;
      for(let week=1;week<=weeks;week++){
        const hasCore=def.items.some(item=>(!item.when||item.when(week))&&LIBRARY[item.id]?.tags.includes("core"));
        if(!hasCore) issues.push(`${def.key} has no core exercise in week ${week}`);
      }
    }
  }
  return [...new Set(issues)];
}

// ── TOAST ──────────────────────────────────────────────────────────────────
let toastTO;
function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toastTO); toastTO=setTimeout(()=>el.classList.remove("show"),2400); }

// ── NAVIGATION ─────────────────────────────────────────────────────────────
function goTo(name){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById("screen-"+name).classList.add("active");
  const nb=document.querySelector(`[data-screen="${name}"]`);
  if(nb) nb.classList.add("active");
  if(name==="workout")  renderWorkout();
  if(name==="calendar") renderCalendar();
  if(name==="settings") renderSettings();
}

// ── WORKOUT SCREEN ─────────────────────────────────────────────────────────
function chips(plan){
  return `<span class="chip ${TAG_CHIPS[plan.tag]||"chip-strength"}">${esc(plan.tag)}</span>${plan.dur?`<span class="chip chip-dur">${esc(plan.dur)}</span>`:""}${plan.optional?`<span class="chip chip-dur">Optional</span>`:""}${S.moves?.[plan.pid]?`<span class="chip chip-dur">Moved from ${esc(shortDate(plan.origKey))}</span>`:""}`;
}
const SKIP_REASONS=["Tired","Travel","Soreness","Busy"];
function skipChoices(plan,key){
  const attrs=`data-key="${key}" data-pid="${esc(plan.pid)}"`;
  return `<div class="chip-row">${SKIP_REASONS.map(r=>`<button class="choice-btn" data-act="skip" data-reason="${r}" ${attrs}>${r}</button>`).join("")}<button class="choice-btn" data-act="skip" data-reason="" ${attrs}>No reason</button></div>`;
}
function moveControls(plan,key){
  return `<div class="move-row">
    <input class="log-field" type="date" value="${key}" aria-label="New date for ${esc(plan.name)}">
    <button class="move-btn" data-act="move" data-key="${key}" data-pid="${esc(plan.pid)}">Move</button>
  </div><div class="warning" hidden></div>`;
}
function planOptions(plan,key){
  const today=todayKey(), defaultDate=key<today?key:addDays(today,-1);
  return `<details class="plan-options"><summary>More options</summary>
    <div class="option-label">Done on another date</div>
    <div class="move-row">
      <input class="log-field" type="date" value="${defaultDate}" aria-label="Date you did ${esc(plan.name)}">
      <button class="move-btn" data-act="done-on" data-key="${key}" data-pid="${esc(plan.pid)}">Log</button>
    </div>
    ${plan.noMakeup?"":`<div class="option-label">Move</div>${moveControls(plan,key)}`}
    <div class="option-label">Skip</div>
    ${skipChoices(plan,key)}
  </details>`;
}
function decisionCard(items){
  if(!items.length) return "";
  return `<div class="decision-card">
    <div class="decision-title">Needs a decision</div>
    ${items.map(({plan,key})=>`<div class="decision-item">
      <div class="decision-name">${esc(plan.name)}<span>${esc(shortDate(key))}</span></div>
      <div class="decision-actions">
        <button class="choice-btn" data-act="did" data-key="${key}" data-pid="${esc(plan.pid)}">I did it</button>
        ${plan.noMakeup?"":`<details class="choice-details"><summary class="choice-btn">Make up</summary>${moveControls(plan,key)}</details>`}
        <details class="choice-details"><summary class="choice-btn">Skip</summary>${skipChoices(plan,key)}</details>
      </div>
    </div>`).join("")}
  </div>`;
}
function renderIdle(){
  const key=todayKey(), d=new Date(), block=blockFor(key);
  document.getElementById("wk-eyebrow").textContent=`${DAYS[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}`;
  const wrap=document.getElementById("wk-sessions");
  if(!block){
    document.getElementById("wk-today-title").textContent="Between blocks";
    document.getElementById("wk-block-line").textContent="";
    wrap.innerHTML=`<div class="wk-empty">No block is scheduled for today.</div>`;
    return;
  }
  const week=weekOf(block,key), light=block.lightWeeks.includes(week);
  document.getElementById("wk-today-title").textContent="Today";
  document.getElementById("wk-block-line").textContent=`${block.name} · Week ${week} of ${totalWeeks(block)}${light?" · Lighter":""}`;
  let previewShown=false;
  const cards=sessionsFor(key).map(plan=>{
    const status=planStatus(plan,key);
    if(status==="skipped") return skippedCard(plan,key);
    const logged=status==="done";
    const showPreview=!logged&&!previewShown; if(showPreview) previewShown=true;
    const rows=showPreview?plan.exercises.map(e=>`<div class="preview-row"><span class="preview-name">${esc(e.n)}</span>${e.tgt?`<span class="preview-target">${esc(e.tgt)}</span>`:""}</div>`).join(""):"";
    return `<div class="session-card${logged?" logged":""}">
      <div class="session-name">${logged?"✓ ":""}${esc(plan.name)}</div>
      <div class="wk-chips">${chips(plan)}</div>
      ${rows}
      <button class="start-btn" data-act="open" data-key="${key}" data-pid="${esc(plan.pid)}">${logged?"View or edit":"Start"} <span class="go-arrow">→</span></button>
      ${logged?"":planOptions(plan,key)}
    </div>`;
  }).join("")||`<div class="wk-empty">No session scheduled.</div>`;
  wrap.innerHTML=decisionCard(pendingDecisions())+cards+pullForwardList();
}
function skippedCard(plan,key){
  const reason=S.skips[plan.pid]?.reason;
  return `<div class="session-card skipped">
    <div class="session-name">${esc(plan.name)}</div>
    <div class="skip-line">Skipped${reason?` · ${esc(reason)}`:""}</div>
    <button class="choice-btn" data-act="undo-skip" data-key="${key}" data-pid="${esc(plan.pid)}">Undo skip</button>
  </div>`;
}
function pullForwardList(){
  const items=upcomingSessions(), today=todayKey();
  if(!items.length) return "";
  return `<details class="plan-options pull-list"><summary>Do something else today</summary>
    ${items.map(({plan,key})=>{
      const warnings=recoveryWarnings(plan,today);
      return `<div class="pull-item">
        <div class="decision-name">${esc(plan.name)}<span>${esc(shortDate(key))}</span></div>
        ${warnings.map(w=>`<div class="warning">${esc(w)}</div>`).join("")}
        <button class="choice-btn" data-act="pull" data-key="${key}" data-pid="${esc(plan.pid)}">Do today</button>
      </div>`;
    }).join("")}
  </details>`;
}
function findPlan(key,pid){ return sessionsFor(key).find(p=>p.pid===pid)||null; }
function refreshScreens(){
  if(document.getElementById("screen-calendar").classList.contains("active")) renderCalendar();
  else renderWorkout();
}
function handleSessionAction(btn){
  const {act,key,pid}=btn.dataset, plan=findPlan(key,pid); if(!plan) return;
  if(act==="open") openSession(key,pid);
  if(act==="did"){ if(plan.quickLog) quickLog(plan,key); else openSession(key,pid); }
  if(act==="done-on"){
    const to=btn.previousElementSibling.value; if(!to) return;
    beginSession(sessionFromPlan(plan,key,to));
  }
  if(act==="pull") beginSession(sessionFromPlan(plan,key,todayKey()));
  if(act==="skip") skipSession(plan,key,btn.dataset.reason);
  if(act==="undo-skip"){ delete S.skips[pid]; save(); refreshScreens(); }
  if(act==="move"){
    const to=btn.previousElementSibling.value, warning=btn.parentElement.nextElementSibling;
    if(!to||to===key) return;
    const warnings=recoveryWarnings(plan,to);
    if(warnings.length&&btn.dataset.armed!==to){
      btn.dataset.armed=to; btn.textContent="Move anyway";
      warning.textContent=warnings.join(" "); warning.hidden=false;
      return;
    }
    moveSession(pid,to); delete S.skips?.[pid]; save();
    toast(`Moved to ${shortDate(to)}`);
    if(document.getElementById("screen-calendar").classList.contains("active")){
      const date=parseKey(to);
      calSelected=to; calYear=date.getFullYear(); calMonth=date.getMonth();
    }
    refreshScreens();
  }
}
async function quickLog(plan,key){
  const session=sessionFromPlan(plan,key);
  session.exercises.forEach(ex=>{ ex.done=true; });
  S.session=session;
  const payload=sessionPayload(session,"");
  archiveSession("");
  refreshScreens();
  toast((await postToSheet(payload))?"Logged and saved to Sheet":"Logged in Endure");
}
async function skipSession(plan,key,reason){
  if(!S.skips) S.skips={};
  S.skips[plan.pid]={reason};
  save(); refreshScreens();
  const [y,m,d]=key.split("-").map(Number), date=`${m}/${d}/${y}`;
  const saved=await postToSheet({id:plan.pid,date,previousDate:date,name:plan.name,notes:"",
    exercises:[{name:"Skipped",value:reason||"No reason given",target:""}]});
  toast(saved?"Skipped and saved to Sheet":"Skipped in Endure");
}

function fieldHtml(ei,f,value,attrs){
  if(f.type==="select"){
    const opts=f.opts.map(o=>`<option value="${esc(o)}"${value===o?" selected":""}>${esc(o)}</option>`).join("");
    return `<select class="log-field" ${attrs}><option value="">Select…</option>${opts}</select>`;
  }
  return `<input class="log-field" ${attrs} value="${esc(value)}"${f.inputmode?` inputmode="${f.inputmode}"`:""}>`;
}
function exerciseBody(ex,ei){
  let body=ex.how?`<div class="ex-how">${esc(ex.how)}</div>`:"";
  if(ex.last) body+=`<div class="ex-how">Last time: ${esc(ex.last)}</div>`;
  if(ex.t==="sets"){
    const rows=ex.sets.map((st,si)=>`
      <div class="set-row">
        <span class="set-num">Set ${si+1}</span>
        <input class="set-field${st.logged?" logged":""}" data-ei="${ei}" data-si="${si}" data-f="r" value="${esc(st.r)}" placeholder="reps">
        <span class="set-x">×</span>
        <input class="set-field${st.logged?" logged":""}" data-ei="${ei}" data-si="${si}" data-f="w" value="${esc(st.w)}" placeholder="wt" style="max-width:72px">
        <button class="set-check${st.logged?" logged":""}" data-ei="${ei}" data-si="${si}">✓</button>
      </div>`).join("");
    body+=`<div class="sets-head">Sets — tap ✓ to log each set</div>${rows}
      <button class="add-set" data-ei="${ei}">+ add set</button>`;
  } else if(ex.t==="select"){
    const opts=(ex.opts||[]).map(o=>`<option value="${esc(o)}"${ex.note===o?" selected":""}>${esc(o)}</option>`).join("");
    body+=`<select class="select-field" data-ei="${ei}"><option value="">Select…</option>${opts}</select>`;
  } else if(ex.t==="fields"){
    const fields=exerciseFields(ex);
    body+=`<div class="field-grid">${fields.map(f=>`<label class="field-wrap"><span>${esc(f.label)}</span>${fieldHtml(ei,f,ex.vals?.[f.k]||"",`data-ei="${ei}" data-k="${f.k}"`)}</label>`).join("")}</div>`;
  } else if(ex.t==="rows"){
    const cols=exerciseColumns(ex);
    body+=ex.rows.map((row,ri)=>`<div class="row-card"><div class="field-grid">${cols.map(f=>`<label class="field-wrap"><span>${esc(f.label)}</span>${fieldHtml(ei,f,row[f.k]||"",`data-ei="${ei}" data-ri="${ri}" data-k="${f.k}"`)}</label>`).join("")}</div></div>`).join("")
      +`<button class="add-row" data-ei="${ei}">+ add pitch group</button>`;
  } else if(ex.t==="note"){
    body+=`<textarea class="note-field" data-ei="${ei}" placeholder="log notes…" rows="2">${esc(ex.note)}</textarea>`;
  }
  return body;
}
function exerciseFields(ex){ return ex.fields||LIBRARY[ex.id]?.fields||[]; }
function exerciseColumns(ex){ return ex.columns||LIBRARY[ex.id]?.columns||[]; }

function renderProgress(){
  const cs=S.session, done=cs.exercises.filter(e=>e.done).length, total=cs.exercises.length;
  document.getElementById("progress-fill").style.width=`${total?(done/total*100):0}%`;
  document.getElementById("progress-label").textContent=`${done} of ${total} complete`;
  document.getElementById("finish-btn").disabled=done===0;
}
function renderWorkout(){
  const idle=document.getElementById("wk-idle");
  const active=document.getElementById("wk-active");
  if(!S.session){
    idle.style.display="block"; active.style.display="none";
    renderIdle();
    return;
  }
  idle.style.display="none"; active.style.display="block";
  const cs=S.session;
  document.getElementById("wk-title").textContent=cs.name;
  document.getElementById("discard-btn").textContent="Discard session";
  discardArmed=false;
  // context banner — show date if not today
  const todayK=todayKey();
  const sesKey=cs.dateKey||todayK;
  const existingBanner=document.getElementById("wk-context-banner");
  if(existingBanner) existingBanner.remove();
  if(sesKey!==todayK){
    const bdate=parseKey(sesKey);
    const bStr=`${DAYS[bdate.getDay()]}, ${MONTHS[bdate.getMonth()]} ${bdate.getDate()}, ${bdate.getFullYear()}`;
    const isPast=sesKey<todayK;
    const banner=document.createElement("div");
    banner.id="wk-context-banner";
    banner.style.cssText="display:flex;align-items:center;gap:8px;padding:7px 11px;background:var(--bg3);border:1px solid var(--border2);border-radius:9px;margin-bottom:12px;font-size:12px;color:var(--text2);";
    banner.innerHTML=`<span style="font-size:15px">${isPast?"📅":"📆"}</span><span>${isPast?"Logging past session":"Editing future session"}: <strong style="color:var(--text)">${bStr}</strong></span>`;
    document.getElementById("wk-active").insertBefore(banner, document.getElementById("wk-active").firstChild);
  }
  renderProgress();
  document.getElementById("ex-list").innerHTML=cs.exercises.map((ex,ei)=>{
    const body=exerciseBody(ex,ei);
    return `
      <div class="ex-card${ex.done?" done":""}${ex.open?" open":""}" data-ei="${ei}">
        <div class="ex-header" data-ei="${ei}">
          <div class="ex-circle" data-circle="${ei}">${ex.done?"✓":""}</div>
          <div class="ex-info"><div class="ex-name">${esc(ex.n)}</div>${ex.tgt?`<div class="ex-tgt">${esc(ex.tgt)}</div>`:""}</div>
          ${body?`<span class="ex-chevron">⌄</span>`:""}
        </div>
        ${body?`<div class="ex-body">${body}</div>`:""}
      </div>`;
  }).join("");
  bindWorkoutEvents();
}

function markDone(ei,done){
  const ex=S.session.exercises[ei]; ex.done=done;
  const card=document.querySelector(`.ex-card[data-ei="${ei}"]`);
  if(card){
    card.classList.toggle("done",done);
    card.querySelector(".ex-circle").textContent=done?"✓":"";
  }
  renderProgress();
}
function bindWorkoutEvents(){
  document.querySelectorAll(".ex-header").forEach(h=>{
    h.addEventListener("click",e=>{
      if(e.target.closest("[data-circle]")) return;
      const ei=parseInt(h.dataset.ei);
      S.session.exercises[ei].open=!S.session.exercises[ei].open;
      save(); renderWorkout();
    });
  });
  document.querySelectorAll("[data-circle]").forEach(c=>{
    c.addEventListener("click",e=>{
      e.stopPropagation();
      const ei=parseInt(c.dataset.circle);
      S.session.exercises[ei].done=!S.session.exercises[ei].done;
      save(); renderWorkout();
    });
  });
  document.querySelectorAll(".set-field").forEach(inp=>{
    inp.addEventListener("change",()=>{
      const ei=parseInt(inp.dataset.ei), si=parseInt(inp.dataset.si);
      S.session.exercises[ei].sets[si][inp.dataset.f]=inp.value;
      save();
    });
  });
  document.querySelectorAll(".set-check").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const ei=parseInt(btn.dataset.ei), si=parseInt(btn.dataset.si);
      const set=S.session.exercises[ei].sets[si];
      set.logged=!set.logged;
      if(S.session.exercises[ei].sets.every(s=>s.logged)) S.session.exercises[ei].done=true;
      save();
      renderWorkout();
    });
  });
  document.querySelectorAll(".add-set").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const ei=parseInt(btn.dataset.ei);
      const last=S.session.exercises[ei].sets.slice(-1)[0]||{r:"",w:""};
      S.session.exercises[ei].sets.push({r:last.r,w:last.w,logged:false});
      save(); renderWorkout();
    });
  });
  document.querySelectorAll(".add-row").forEach(btn=>{
    btn.addEventListener("click",()=>{
      S.session.exercises[parseInt(btn.dataset.ei)].rows.push({});
      save(); renderWorkout();
    });
  });
  document.querySelectorAll("#ex-list .log-field").forEach(el=>{
    el.addEventListener("change",()=>{
      const ei=parseInt(el.dataset.ei), ex=S.session.exercises[ei];
      if(el.dataset.ri!==undefined) ex.rows[parseInt(el.dataset.ri)][el.dataset.k]=el.value;
      else ex.vals[el.dataset.k]=el.value;
      const hasEntry=ex.t==="rows"
        ?ex.rows.some(row=>Object.values(row).some(v=>String(v).trim()))
        :Object.keys(ex.vals).some(k=>String(ex.vals[k]).trim()&&ex.vals[k]!==ex.prefill?.[k]);
      markDone(ei,hasEntry); save();
    });
  });
  document.querySelectorAll(".note-field").forEach(ta=>{
    ta.addEventListener("input",()=>{
      const ei=parseInt(ta.dataset.ei);
      S.session.exercises[ei].note=ta.value;
      markDone(ei,ta.value.trim().length>0);
      save();
    });
  });
  document.querySelectorAll(".select-field").forEach(sel=>{
    sel.addEventListener("change",()=>{
      const ei=parseInt(sel.dataset.ei);
      S.session.exercises[ei].note=sel.value;
      markDone(ei,sel.value.trim().length>0);
      save();
    });
  });
}

// ── SESSION INIT ───────────────────────────────────────────────────────────
function lastLog(id,key){
  const logs=S.history.filter(h=>h.dateKey<key&&(h.exercises||[]).some(e=>e.id===id&&e.done))
    .sort((a,b)=>b.dateKey.localeCompare(a.dateKey));
  return logs[0]?.exercises.find(e=>e.id===id&&e.done)||null;
}
function formatVals(ex){
  return exerciseFields(ex).filter(f=>ex.vals?.[f.k]).map(f=>`${f.label}: ${ex.vals[f.k]}`).join(" · ");
}
function newExercise(e,key){
  const lib=LIBRARY[e.id]||{}, base={...e,done:false,note:"",open:false,vals:{},rows:[{}],sets:[]};
  if(e.t==="sets") base.sets=Array.from({length:e.ds},()=>({r:e.dr,w:e.dw,logged:false}));
  if(e.t==="fields"){
    const last=lastLog(e.id,key);
    const carried={...(lib.defaults||{}),...(lib.start||{})};
    if(last?.vals){
      if(last.vals.level) carried.level=last.vals.level;
      if(last.vals.load) carried.load=last.vals.load;
      base.last=formatVals(last);
    }
    base.vals={...carried}; base.prefill={...carried};
  }
  return base;
}
function sessionFromPlan(plan,key,actualKey=key){
  return {pid:plan.pid,origKey:plan.origKey,sid:plan.sid,blockId:plan.blockId,name:plan.name,tag:plan.tag,start:Date.now(),dateKey:actualKey,sourceDate:key,editing:false,
    exercises:plan.exercises.map(e=>newExercise(e,actualKey))};
}
function sessionFromLog(log){
  const pid=pidOf(log);
  return {pid,origKey:pid?pid.split("|")[0]:null,sid:log.sid,blockId:log.blockId,name:log.name,tag:log.tag,start:Date.now(),dateKey:log.dateKey,sourceDate:log.dateKey,editing:true,notes:log.notes||"",
    exercises:(log.exercises||[]).map(ex=>({
      id:ex.id,n:ex.n,tgt:ex.tgt,t:ex.t,done:ex.done,note:ex.note||"",open:false,how:ex.how||"",
      opts:ex.t==="select"&&ex.note?[ex.note]:ex.opts,
      vals:{...(ex.vals||{})},prefill:{},rows:ex.rows?.length?ex.rows:[{}],
      sets:ex.t==="sets"
        ?(ex.sets?.length?ex.sets.map(s=>({r:s.r,w:s.w,logged:true})):Array.from({length:LIBRARY[ex.id]?.ds||3},()=>({r:"",w:"",logged:false})))
        :[]
    }))};
}
function beginSession(session){
  if(S.session){ toast("Finish or discard the open session first"); goTo("workout"); return; }
  S.session=session; save(); goTo("workout");
}
function openSession(key,pid){
  const plan=sessionsFor(key).find(p=>p.pid===pid); if(!plan) return;
  const log=findLog(plan);
  beginSession(log?sessionFromLog(log):sessionFromPlan(plan,key));
}

// ── SUMMARY ────────────────────────────────────────────────────────────────
function exerciseValue(ex){
  if(ex.t==="sets"){
    const logged=(ex.sets||[]).filter(s=>s.logged!==false);
    return logged.length?logged.map((s,i)=>`Set ${i+1}: ${s.r} × ${s.w}`).join(", "):"completed";
  }
  if(ex.t==="fields") return formatVals(ex)||"done";
  if(ex.t==="rows"){
    const cols=exerciseColumns(ex);
    const rows=(ex.rows||[]).filter(r=>Object.values(r).some(v=>String(v).trim()));
    return rows.map(r=>cols.filter(c=>r[c.k]).map(c=>`${c.label}: ${r[c.k]}`).join(" · ")).join(" | ")||"done";
  }
  return ex.note||"done";
}
function renderSummaryTitle(){
  const cs=S.session, dk=cs.dateKey||todayKey();
  const elapsed=Math.round((Date.now()-cs.start)/60000);
  const sdate=parseKey(dk);
  const dateLabel=dk===todayKey()?"Today":`${DAYS[sdate.getDay()]}, ${MONTHS[sdate.getMonth()]} ${sdate.getDate()}`;
  document.getElementById("sum-sub").textContent=`${cs.name} · ${dateLabel} · ${elapsed} min`;
}
function renderSummary(){
  const cs=S.session; if(!cs) return;
  renderSummaryTitle();
  document.getElementById("sum-date").value=cs.dateKey||todayKey();
  document.getElementById("sum-notes").value=cs.notes||"";
  const btn=document.getElementById("save-btn");
  btn.disabled=false; btn.textContent="Save to Google Sheet";
  document.getElementById("save-msg").style.display="none";
  document.getElementById("sum-list").innerHTML=cs.exercises.map(ex=>{
    if(!ex.done) return "";
    return `<div class="sum-ex"><div class="sum-ex-name">✓ ${esc(ex.n)}</div><div class="sum-ex-detail">${esc(exerciseValue(ex)).replace(/, Set/g,"<br>Set")}</div></div>`;
  }).join("");
}

function buildPayload(){
  const cs=S.session;
  const parts=(cs.dateKey||todayKey()).split("-").map(Number);
  const notes=document.getElementById("sum-notes").value.trim();
  const lines=[`${parts[1]}/${parts[2]}/${parts[0]} — ${cs.name}`];
  cs.exercises.filter(ex=>ex.done).forEach(ex=>lines.push(`${ex.n}: ${exerciseValue(ex)} (target: ${ex.tgt})`));
  if(notes) lines.push(`Notes: ${notes}`);
  return lines.join("\n");
}

function sessionPayload(cs,notes){
  const [dy,dm,dd]=(cs.dateKey||todayKey()).split("-").map(Number);
  const [py,pm,pd]=(cs.sourceDate||cs.dateKey||todayKey()).split("-").map(Number);
  return {
    id:cs.pid||`${cs.sourceDate||cs.dateKey}|${cs.name}`,
    date:`${dm}/${dd}/${dy}`,
    previousDate:`${pm}/${pd}/${py}`,
    name:cs.name,
    notes,
    exercises:cs.exercises.filter(e=>e.done).map(ex=>({name:ex.n,value:exerciseValue(ex),target:ex.tgt||""}))
  };
}
function hasWebhook(){ return !!S.sheetId&&S.sheetId.startsWith("https://script.google.com"); }
async function postToSheet(payload){
  if(!hasWebhook()) return false;
  try{
    // Apps Script requires no-cors for cross-origin POST from a PWA
    await fetch(S.sheetId,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    // no-cors means we can't read the response — assume success if no network error
    return true;
  }catch(e){ return false; }
}
async function doSave(){
  const btn=document.getElementById("save-btn");
  const msg=document.getElementById("save-msg");
  if(!S.session){ goTo("workout"); return; }
  btn.disabled=true; btn.textContent="Saving…"; msg.style.display="none";
  const notes=document.getElementById("sum-notes").value.trim();
  const saved=await postToSheet(sessionPayload(S.session,notes));
  if(saved){
    msg.className="save-msg ok"; msg.textContent="Saved to Google Sheet ✓";
  } else {
    try{ await navigator.clipboard.writeText(buildPayload()); }catch(_){}
    msg.className="save-msg err";
    msg.textContent=hasWebhook()?"Couldn't reach Google Sheet — copied to clipboard instead.":"No webhook URL set in Settings — copied to clipboard instead.";
  }
  msg.style.display="block";
  archiveSession(notes);
  btn.disabled=false; btn.textContent="Back to today";
}

function archiveSession(notes=""){
  if(!S.session) return;
  const cs=S.session, key=cs.dateKey||todayKey();
  const entry={
    dateKey:key, pid:cs.pid, sid:cs.sid, blockId:cs.blockId,
    name:cs.name, tag:cs.tag||"",
    done:cs.exercises.filter(e=>e.done).length,
    total:cs.exercises.length,
    elapsed:Math.round((Date.now()-cs.start)/60000),
    notes,
    exercises:cs.exercises.map(ex=>({
      id:ex.id, n:ex.n, tgt:ex.tgt, t:ex.t, done:ex.done, note:ex.note, how:ex.how,
      vals:ex.vals, rows:ex.rows,
      sets:(ex.sets||[]).filter(s=>s.logged)
    }))
  };
  // Replace a resubmitted session only, so other sessions that day stay logged.
  const idx=cs.pid
    ?S.history.findIndex(h=>pidOf(h)===cs.pid)
    :S.history.findIndex(h=>h.dateKey===(cs.sourceDate||key)&&h.name===cs.name&&!pidOf(h));
  if(idx>=0) S.history[idx]=entry; else S.history.unshift(entry);
  if(cs.pid&&cs.origKey&&blockFor(cs.origKey)) moveSession(cs.pid,key);
  if(cs.pid&&S.skips) delete S.skips[cs.pid];
  S.session=null; save();
}

// ── CALENDAR ───────────────────────────────────────────────────────────────
let calYear=new Date().getFullYear(), calMonth=new Date().getMonth();
let calSelected=null;

function renderCalendar(){
  document.getElementById("cal-month-title").textContent=`${MONTHS_FULL[calMonth]} ${calYear}`;
  const todayK=todayKey();
  const firstDow=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const grid=document.getElementById("cal-grid");
  let html="";
  for(let i=0;i<firstDow;i++) html+=`<div class="cal-day empty"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const key=`${calYear}-${String(calMonth+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const plans=sessionsFor(key), hasPlan=plans.length>0;
    const logged=getLogs(key).length>0;
    let cls="cal-day";
    if(key===todayK) cls+=" today";
    if(logged) cls+=" logged has-session";
    else if(hasPlan&&key>todayK) cls+=" scheduled has-session";
    else if(plans.length&&plans.every(plan=>planStatus(plan,key)==="skipped")) cls+=" skipped has-session";
    else if(plans.some(plan=>planStatus(plan,key)==="needs")&&key>=weekStart(todayK)) cls+=" needs has-session";
    else if(hasPlan&&key<todayK) cls+=" past-no-session has-session";
    if(calSelected===key) cls+=" selected";
    html+=`<div class="${cls}" data-key="${key}"><span class="cal-day-num">${d}</span><span class="cal-dot"></span></div>`;
  }
  grid.innerHTML=html;
  grid.querySelectorAll(".cal-day:not(.empty)").forEach(el=>{
    el.addEventListener("click",()=>{
      calSelected=calSelected===el.dataset.key?null:el.dataset.key;
      renderCalendar();
    });
  });
  renderCalendarDetail();
}

function logDetail(log,idx){
  const donePct=log.total?Math.round(log.done/log.total*100):0;
  const planned=pidOf(log)?.split("|")[0];
  const rows=(log.exercises||[]).filter(e=>e.done).map(ex=>`<div class="cal-detail-row"><span class="cal-detail-ex">${esc(ex.n)}</span><span class="cal-detail-val">${esc(exerciseValue(ex))}</span></div>`).join("");
  return `<div class="cal-detail">
    <div class="cal-detail-name">${esc(log.name)} <span style="font-size:12px;font-weight:400;color:var(--text3)">· ${log.elapsed} min · ${donePct}%</span></div>
    ${planned&&planned!==log.dateKey&&blockFor(planned)?`<div class="skip-line">Planned for ${esc(shortDate(planned))}</div>`:""}
    ${rows}
    ${log.notes?`<div style="margin-top:10px;font-size:12px;color:var(--text3);font-style:italic">"${esc(log.notes)}"</div>`:""}
    <button class="cal-open-btn" data-log="${idx}">Edit / resubmit workout →</button>
  </div>`;
}
function renderCalendarDetail(){
  const wrap=document.getElementById("cal-detail-wrap");
  if(!calSelected){ wrap.innerHTML=""; return; }
  const key=calSelected, date=parseKey(key);
  const dateStr=`${DAYS[date.getDay()]}, ${MONTHS[date.getMonth()]} ${date.getDate()}, ${date.getFullYear()}`;
  const logs=getLogs(key), plans=sessionsFor(key), todayK=todayKey();
  const usedLogs=new Set();
  let html=`<div class="cal-detail-date">${dateStr}</div>`;
  plans.forEach(plan=>{
    const log=findLog(plan);
    if(log){ usedLogs.add(log); html+=logDetail(log,S.history.indexOf(log)); return; }
    if(planStatus(plan,key)==="skipped"){ html+=skippedCard(plan,key); return; }
    const rows=plan.exercises.map(e=>`<div class="cal-future-ex"><span>${esc(e.n)}</span>${e.tgt?`<span class="cal-future-tgt">${esc(e.tgt)}</span>`:""}</div>`).join("");
    html+=`<div class="cal-detail">
      <div class="cal-detail-head"><div class="cal-detail-name" style="margin-bottom:0">${esc(plan.name)}${key<todayK?` <span style="font-size:12px;font-weight:400">— not logged</span>`:""}</div></div>
      <div class="wk-chips">${chips(plan)}</div>
      ${rows}
      <button class="cal-open-btn" data-act="open" data-key="${key}" data-pid="${esc(plan.pid)}">${key===todayK?"Open today's workout":"Open workout"} →</button>
      ${planOptions(plan,key)}
    </div>`;
  });
  logs.filter(log=>!usedLogs.has(log)).forEach(log=>{ html+=logDetail(log,S.history.indexOf(log)); });
  if(!plans.length&&!logs.length) html+=`<div class="cal-detail"><div class="cal-detail-name" style="color:var(--text3);margin-bottom:0">Nothing scheduled</div></div>`;
  wrap.innerHTML=html;
  wrap.querySelectorAll("[data-log]").forEach(btn=>{
    btn.addEventListener("click",()=>beginSession(sessionFromLog(S.history[parseInt(btn.dataset.log)])));
  });
}

// ── SETTINGS ───────────────────────────────────────────────────────────────
function renderSettings(){
  document.getElementById("sheet-input").value=S.sheetId||"";
  const key=todayKey(), block=blockFor(key)||BLOCKS[BLOCKS.length-1];
  document.getElementById("block-name").textContent=block.name;
  const start=parseKey(block.start), end=parseKey(block.end);
  const dates=`${MONTHS[start.getMonth()]} ${start.getDate()}, ${start.getFullYear()} – ${MONTHS[end.getMonth()]} ${end.getDate()}, ${end.getFullYear()}`;
  document.getElementById("week-label").textContent=blockFor(key)?`Week ${weekOf(block,key)} of ${totalWeeks(block)} · ${dates}`:dates;
  const issues=validateBlock(block);
  document.getElementById("block-issues").textContent=issues.length?issues.join("; "):"Every gym day has a core exercise.";
  const used=new Set(Object.values(block.days).flat().flatMap(def=>def.items.map(i=>i.id)));
  const items=Object.entries(LIBRARY).sort((a,b)=>a[1].n.localeCompare(b[1].n));
  document.getElementById("library-count").textContent=`${items.length} exercises · ${used.size} in this block`;
  document.getElementById("library-list").innerHTML=items.map(([id,e])=>`<div class="preview-row"><span class="preview-name">${esc(e.n)}</span><span class="preview-target">${used.has(id)?"In block":""}</span></div>`).join("");
}

// ── BOOT ───────────────────────────────────────────────────────────────────
load();
BLOCKS.forEach(block=>validateBlock(block).forEach(issue=>console.error(`${block.id}: ${issue}`)));
renderWorkout();

document.querySelectorAll(".nav-btn").forEach(btn=>btn.addEventListener("click",()=>goTo(btn.dataset.screen)));

document.getElementById("finish-btn").addEventListener("click",()=>{ renderSummary(); goTo("summary"); });
document.getElementById("save-btn").addEventListener("click",doSave);
["wk-sessions","cal-detail-wrap"].forEach(id=>{
  document.getElementById(id).addEventListener("click",e=>{
    const btn=e.target.closest("button[data-act]");
    if(btn) handleSessionAction(btn);
  });
});
document.getElementById("sum-date").addEventListener("change",e=>{
  if(!S.session||!e.target.value) return;
  S.session.dateKey=e.target.value; save(); renderSummaryTitle();
});

document.getElementById("discard-btn").addEventListener("click",e=>{
  if(!discardArmed){ discardArmed=true; e.target.textContent="Tap again to discard"; return; }
  S.session=null; save(); renderWorkout();
});

// calendar nav
document.getElementById("cal-prev").addEventListener("click",()=>{ calMonth--; if(calMonth<0){calMonth=11;calYear--;} calSelected=null; renderCalendar(); });
document.getElementById("cal-next").addEventListener("click",()=>{ calMonth++; if(calMonth>11){calMonth=0;calYear++;} calSelected=null; renderCalendar(); });

// settings
document.getElementById("sheet-input").addEventListener("change",e=>{ S.sheetId=e.target.value.trim(); save(); });

if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script>
